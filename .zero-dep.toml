# Zero Dependency hackathon submission manifest.
#
# The requirement on record is the track letter and a one-line pitch. The rest
# of this file is evidence a judge can rerun rather than take on faith.

track = "C"
pitch = "A recursive DNS resolver that walks from the root servers and speaks the protocol from raw octets, with an empty go.mod and no third-party code."

# Claimed bonuses, each backed by something a judge can rerun. Single File is
# not attempted. See the Submission Notes in README.md.
[bonuses]
reproducible_build = true # make reproduce, and make verify gates the published hash
stdlib_log = true         # STDLIB.md, 41 substitutions against a required 10
package_killer = true     # README.md, 7 modules replaced, 17 dependencies against 0
single_file = false

[project]
name = "hollow"
repository = "https://github.com/DevInIndia/hollow"
license = "MIT"
language = "Go"
go_version = "1.25"

[dependencies]
count = 0
require_block = false
go_sum = false
vendor_dir = false
proof = "deps-proof.txt"

[verification]
build = "go build ./cmd/hollow"
verify = "make verify"
reproduce = "make reproduce"

# Build hashes are published in README.md rather than duplicated here. They
# change with every commit that touches cmd/hollow or anything it imports, and
# two copies of a value that goes stale is one copy too many.
